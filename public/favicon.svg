<!-- El iconito de la pestaña del navegador. Es el logo de la marca: E|D.

     Va en SVG porque así se ve nítido en cualquier tamaño (la pestaña, el
     marcador, el acceso directo del móvil) con un solo archivo de 400 bytes,
     en vez de media docena de .png de distintas medidas.

     Los colores son los de la marca: fondo claro de la tienda y tinta negra. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#faf9f7"/>
  <g fill="#1c1c1c">
    <!-- E -->
    <rect x="14" y="19" width="5" height="26"/>
    <rect x="14" y="19" width="14" height="5"/>
    <rect x="14" y="29.5" width="11" height="5"/>
    <rect x="14" y="40" width="14" height="5"/>
    <!-- la barra separadora -->
    <rect x="31" y="17" width="2.5" height="30"/>
    <!-- D -->
    <path d="M37 19h8a13 13 0 0 1 0 26h-8V19zm5 5v16h3a8 8 0 0 0 0-16h-3z"/>
  </g>
</svg>
