<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- La tienda es de tema claro. Esto evita que los navegadores móviles con
         "modo oscuro forzado" inviertan la página y la dejen en blanco. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf9f7" />
    <!-- El iconito de la pestaña. Sin esto el navegador enseñaba una hoja en
         blanco, que es lo que ve el cliente cuando guarda la tienda en
         marcadores o la deja abierta entre otras diez pestañas. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Corporación Agamenón — Tarimas, Cabeceras y Muebles</title>
    <meta name="description" content="Corporación Agamenón: tarimas, cabeceras y muebles a medida en Perú. Elige tu tamaño y color, y recíbelo en casa." />

    <!-- Vista previa al compartir el link (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Corporación Agamenón" />
    <meta property="og:title" content="Corporación Agamenón — Tarimas, Cabeceras y Muebles a tu medida" />
    <meta property="og:description" content="Tarimas, cabeceras y muebles a medida en Perú. Elige tamaño y color, y visualiza el cambio al instante." />
    <!-- El archivo se llama og-agamenon.png y no og-image.png a propósito:
         WhatsApp y Facebook se GUARDAN la imagen de cada enlace y no la
         vuelven a pedir en días. Cambiando el archivo de nombre, para ellos
         es una imagen que nunca han visto, así que la piden de nuevo y se ve
         la marca nueva desde el primer envío en vez de la vieja. -->
    <meta property="og:image" content="https://eydperu.vercel.app/og-agamenon.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://eydperu.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corporación Agamenón — Tarimas, Cabeceras y Muebles a tu medida" />
    <meta name="twitter:description" content="Tarimas, cabeceras y muebles a medida en Perú. Elige tamaño y color, y visualiza el cambio al instante." />
    <meta name="twitter:image" content="https://eydperu.vercel.app/og-agamenon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- SDK de Culqi Checkout. Verificar siempre la última versión en https://docs.culqi.com
         NOTA: no lleva integrity (SRI) a propósito. La URL /js/v4 es "rodante":
         Culqi publica parches sobre la misma dirección, así que un hash fijo
         rompería el pago en cuanto ellos actualicen. El riesgo se acota con la
         CSP (script-src limita desde qué dominios se puede cargar código). -->
    <script src="https://checkout.culqi.com/js/v4"></script>
    <!-- Leaflet (mapa gratuito con OpenStreetMap, sin llave de API).
         Versión fija -> sí lleva SRI: si el CDN sirviera un archivo alterado,
         el navegador lo rechaza en vez de ejecutarlo. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
